services:
  web:
    build: .
    container_name: feishu_pwd_web
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./account_mapping.json:/app/account_mapping.json:ro
    networks:
      - caddy_default
    expose:
      - "5002"

networks:
  caddy_default:
    external: true
