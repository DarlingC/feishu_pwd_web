<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内网密码</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 420px;
            width: 100%;
            padding: 24px;
            text-align: center;
        }
        .loading-text {
            font-size: 16px;
            color: #666;
        }
        .error-box p {
            font-size: 16px;
            color: #333;
            line-height: 1.6;
            margin-bottom: 12px;
        }
        .error-box .hint {
            font-size: 14px;
            color: #999;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <p class="loading-text" id="loading">正在验证身份...</p>
        <div class="error-box" id="error-box" style="display:none;"></div>
    </div>

    <script src="https://lf1-cdn-tos.bytegoofy.com/goofy/lark/op/h5-js-sdk-1.5.26.js"></script>
    <script>
        const API_BASE = window.location.pathname.startsWith('/pas') ? '/pas' : '';

        async function getFeishuUser() {
            if (!window.h5sdk) {
                throw new Error('请在飞书应用内打开此页面');
            }

            const appidRes = await fetch(API_BASE + '/api/feishu/appid');
            const appidData = await appidRes.json();

            return new Promise((resolve, reject) => {
                window.h5sdk.error(err => {
                    reject(new Error('飞书 SDK 初始化失败'));
                });

                window.h5sdk.ready(() => {
                    window.tt.requestAccess({
                        appID: appidData.appid,
                        scopeList: [],
                        success(res) {
                            fetch(API_BASE + '/api/feishu/user?code=' + res.code)
                                .then(r => r.json())
                                .then(data => {
                                    if (data.success) {
                                        resolve(data.data);
                                    } else {
                                        reject(new Error(data.error || '获取用户信息失败'));
                                    }
                                })
                                .catch(() => reject(new Error('获取用户信息失败')));
                        },
                        fail(err) {
                            reject(new Error('授权失败，请刷新页面重试'));
                        }
                    });
                });
            });
        }

        async function init() {
            const loading = document.getElementById('loading');
            const errorBox = document.getElementById('error-box');

            try {
                const user = await getFeishuUser();
                // 验证成功，跳转到主功能页面
                window.location.href = API_BASE + '/home?token=' + encodeURIComponent(user.user_id);
            } catch (err) {
                loading.style.display = 'none';
                errorBox.style.display = 'block';
                errorBox.innerHTML = '<p>' + escapeHtml(err.message) + '</p>' +
                    '<p class="hint">请确保从飞书应用入口访问此页面</p>';
                document.title = '内网密码';
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        init();
    </script>
</body>
</html>
